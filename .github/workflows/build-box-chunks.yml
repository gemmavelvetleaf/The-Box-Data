name: Build The Box remote chunks

on:
  push:
    branches: [main]
    paths:
      - 'packs/*.txt'
      - 'tools/split_box_packs.py'
      - '.github/workflows/build-box-chunks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build line-aligned chunks
        run: python3 tools/split_box_packs.py

      - name: Commit generated chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A chunks
          if git diff --cached --quiet; then
            echo "Generated chunks already current."
            exit 0
          fi
          git commit -m "Update generated Box remote chunks"
          git push
