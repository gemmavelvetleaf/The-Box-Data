name: Build The Box scene data

on:
  push:
    branches: [main]
    paths:
      - 'packs/*.txt'
      - 'tools/split_box_packs.py'
      - 'tools/test_split_box_packs.py'
      - 'pack-order.txt'
      - '.github/workflows/build-box-chunks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate generator behavior
        run: python3 -m unittest discover -s tools -p 'test_split_box_packs.py'

      - name: Validate scene packs and build data
        run: python3 tools/split_box_packs.py

      - name: Commit generated chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A chunks
          if git diff --cached --quiet; then
            echo "Generated chunks already current."
            exit 0
          fi
          git commit -m "Update generated Box remote chunks"
          git push

      - name: Explain a failed scene data update
        if: failure()
        run: |
          echo "## ❌ The Box scene data update did not complete" >> "$GITHUB_STEP_SUMMARY"
          echo "Open the failed step above for the file, line, and correction needed." >> "$GITHUB_STEP_SUMMARY"
          echo "The Box may continue using the previous saved scenes until this is fixed." >> "$GITHUB_STEP_SUMMARY"
